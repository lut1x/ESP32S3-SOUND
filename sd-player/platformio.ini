[platformio]
default_envs = soundboard-sd
src_dir = main

[env:soundboard-sd]
platform = platformio/espressif32 @ 6.12.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
upload_speed = 115200
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.embed_txtfiles = main/index.html
